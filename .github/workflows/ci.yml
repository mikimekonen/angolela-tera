name: Government Portal CI/CD Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build, Lint, Test & Type-Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/angolela_tera_db?schema=public"
      JWT_SECRET: "angolela-tera-ci-build-secret-key-32charsmin"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Client Generation
        run: npx prisma generate

      - name: Run Code Lint Checks
        run: npm run lint

      - name: Verify TypeScript Types (Strict Mode)
        run: npx tsc --noEmit

      - name: Run Automated Test Suites
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production
