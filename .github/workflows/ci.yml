name: Government Portal CI/CD Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build, Lint & Type-Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/angolela_tera_db?schema=public"
      JWT_SECRET: "angolela-tera-ci-build-secret-key-32charsmin"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: "production"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Run Prisma Client Generation
        run: npx prisma generate

      - name: Run Next.js Production Build
        run: npm run build

      - name: Verify TypeScript Types (Strict Mode)
        run: npx tsc --noEmit
